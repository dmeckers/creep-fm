services:
  traefik:
    image: traefik:alpine
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $PWD/traefik.toml:/etc/traefik/traefik.toml:ro
      - $PWD/certs:/etc/certs:ro
    networks:
      - internal
      - traefik

  nginx-front:
    image: nginx:latest
    container_name: nginx-front
    expose:
      - "80"
    volumes:
      - ./front/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - front
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-front.rule=Host(`dev.creep-station.com`)"
      - "traefik.http.routers.nginx-front.entrypoints=websecure"
      - "traefik.http.routers.nginx-front.tls.certresolver=myresolver"
      - "traefik.http.services.nginx-front.loadbalancer.server.port=80"

  nginx-api:
    image: nginx:latest
    container_name: nginx-api
    expose:
      - "80"
    volumes:
      - ./api/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - traefik.frontend.rule=Host:api.dev.creep-station.com
      - "traefik.http.routers.nginx-front.rule=Host(`api.dev.creep-station.com`)"
      - "traefik.http.routers.nginx-front.entrypoints=https"
      - "traefik.http.routers.nginx-front.tls=true"
      - "traefik.http.services.nginx-front.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  front:
    build:
      context: ./front
    container_name: front
    ports:
      - "5173:5173"
    expose:
      - "5173"
    volumes:
      - ./front:/app
    networks:
      - internal
    depends_on:
      - api
    command: npm run dev

  api:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile
    container_name: api
    ports:
      - "8000:8000"
      - "5174:5174"
    expose:
      - "8000"
      - "5174"
    volumes:
      - ./api:/var/www/html

  api-taskserver:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile
    container_name: api-taskserver
    hostname: api-taskserver
    ports:
      - "8001:8000"
    expose:
      - "8000"
      - "5174"
    volumes:
      - ./api:/var/www/html
    entrypoint: >
      /bin/sh -c "php artisan queue:work"

  api-scout-runner:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile
    container_name: api-scout-runner
    hostname: api-scout-runner
    ports:
      - "8002:8000"
    expose:
      - "8000"
      - "5174"
    volumes:
      - ./api:/var/www/html
    entrypoint: >
      /bin/sh -c "php artisan queue:work --queue=scout"

    networks:
      - internal
    depends_on:
      - postgres-db
      - redis
      - storage
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - SCOUT_DRIVER=${SCOUT_DRIVER}
      - MEILISEARCH_HOST=${MEILISEARCH_HOST}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLIENT=${REDIS_CLIENT}
      - REDIS_HOST=${REDIS_HOST}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - AWS_URL=${AWS_URL}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT}
      - FILESYSTEM_PUBLIC_DRIVER=${FILESYSTEM_PUBLIC_DRIVER}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK}
      - SERVER_NAME=${SERVER_NAME}
      - OCTANE_SERVER=${OCTANE_SERVER}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER}

