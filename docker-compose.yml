  postgres-db:
    container_name: postgres-db
    hostname: postgres-db
    image: "postgres:17-alpine"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - internal
    ports:
      - "5432:5432"

  storage:
    image: minio/minio
    container_name: storage
    hostname: storage
    ports:
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_REGION=${MINIO_REGION}
    networks:
      - internal
    volumes:
      - ./storage-data:/data
    command: server --address :9001 /data

  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    ports:
      - 6379:6379
    networks:
      - internal
    user: redis

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    hostname: meilisearch
    ports:
      - 7700:7700
    networks:
      - internal

  tg-bot:
    container_name: tg-bot
    hostname: tg-bot
    ports:
      - 3005:3000
    volumes:
      - ./tg:/app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
    # depends_on:
    #   - api
    build:
      context: ./tg
      dockerfile: ./docker/Dockerfile-dev
    networks:
      - internal

  createbuckets:
    image: minio/mc
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://storage:9001 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      if ! /usr/bin/mc ls myminio | grep -q 'killme'; then
        echo 'Creating bucket killme...';
        /usr/bin/mc mb myminio/killme;
        /usr/bin/mc anonymous set public myminio/killme;
      else
        echo 'Bucket killme already exists, skipping creation.';
      fi;
      exit 0;
      "
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  traefik:
    driver: bridge
