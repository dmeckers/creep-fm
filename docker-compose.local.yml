services:
  front:
    build:
      context: ./front
    container_name: front
    ports:
      - "5173:5173"
    expose:
      - "5173"
    volumes:
      - ./front:/app
    networks:
      - internal
    depends_on:
      - api
    env_file:
      - .env.local
    command: npm run dev

  api-taskserver:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile.local
    container_name: api-taskserver
    hostname: api-taskserver
    ports:
      - "8001:8000"
    expose:
      - "8000"
      - "5174"
    networks:
      - internal
    volumes:
      - ./api:/var/www
    entrypoint: /bin/sh -c "php artisan queue:work"
    depends_on:
      - postgres-db
      - redis
      - storage
    env_file:
      - .env.local

  api-scout-runner:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile
    container_name: api-scout-runner
    hostname: api-scout-runner
    ports:
      - "8002:8000"
    expose:
      - "8000"
      - "5174"
    volumes:
      - ./api:/var/www/html
    entrypoint: /bin/sh -c "php artisan queue:work --queue=scout"
    networks:
      - internal
    depends_on:
      - postgres-db
      - redis
      - storage
    env_file:
      - .env.local

  api:
    image: nginx:alpine
    container_name: api
    hostname: api
    networks:
      - internal
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www
      - ./nginx/conf/local/api/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-fpm

  api-fpm:
    build:
      context: ./api
      dockerfile: ./docker/Dockerfile.local
    container_name: api-fpm
    hostname: api-fpm
    ports:
      - "9000:9000"
    volumes:
      - ./api:/var/www
    networks:
      - internal
    depends_on:
      - postgres-db
      - redis
      - storage
    environment:
      - AWS_BUCKET=${AWS_BUCKET}
    env_file:
      - .env.local

  postgres-db:
    container_name: postgres-db
    hostname: postgres-db
    image: "postgres:17-alpine"
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "5432:5432"

  tg-bot:
    container_name: tg-bot
    hostname: tg-bot
    ports:
      - 3005:3000
    volumes:
      - ./tg:/app
    env_file:
      - .env.local
    depends_on:
      - api
    build:
      context: ./tg
      dockerfile: ./docker/Dockerfile-dev
    networks:
      - internal

  storage:
    image: minio/minio
    container_name: storage
    hostname: storage
    ports:
      - "9001:9001"
    env_file:
      - .env.local
    networks:
      - internal
    volumes:
      - ./storage-data:/data
    command: server --address :9001 /data

  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    ports:
      - 6379:6379
    networks:
      - internal
    user: redis

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    hostname: meilisearch
    ports:
      - 7700:7700
    networks:
      - internal

  createbuckets:
    image: minio/mc
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://storage:9001 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      if ! /usr/bin/mc ls myminio | grep -q 'killme'; then
        echo 'Creating bucket killme...';
        /usr/bin/mc mb myminio/killme;
        /usr/bin/mc anonymous set public myminio/killme;
      else
        echo 'Bucket killme already exists, skipping creation.';
      fi;
      exit 0;
      "
    networks:
      - internal

volumes:
  postgres_data:
  telegram-bot-api-data:

networks:
  internal:
    driver: bridge
  traefik:
    driver: bridge
