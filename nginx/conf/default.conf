# In your HTTPS server for main site (cream-fm.art)
server {
    listen 443 ssl;
    server_name cream-fm.art;

    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/cream-fm.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cream-fm.art/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Proxy /api requests to api:8000
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve front-end files
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}
