# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name cream-fm.art api.cream-fm.art;

    # Required for Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for main site
server {
    listen 443 ssl;
    server_name cream-fm.art;

    client_max_body_size 500M;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/cream-fm.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cream-fm.art/privkey.pem;

    # SSL settings (recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Serve front-end files
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS server for API
server {
    listen 443 ssl;
    server_name api.cream-fm.art;

    client_max_body_size 500M;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/cream-fm.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cream-fm.art/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Proxy to API service
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}